name: Nexum Steward website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "INSTALL.md"
      - "templates/plugin.json"
      - ".github/workflows/pages.yml"
      - "tests/plugin.test.mjs"
      - "tests/site.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexum-steward-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify static website
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Verify plugin manifest
        run: node --test tests/plugin.test.mjs
      - name: Type-check and build
        working-directory: site
        run: pnpm check && pnpm build
      - name: Check static output
        run: node --test tests/site.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
